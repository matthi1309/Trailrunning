<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notfall-Fallquiz</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d2430;
    --muted: #5b6676;
    --border: #d9dee5;
    --accent: #c62828;
    --accent-soft: #fdecea;
    --ok: #2e7d32;
    --ok-soft: #e8f5e9;
    --bad: #c62828;
    --bad-soft: #fdecea;
    --warn: #a15c00;
    --warn-soft: #fff4e0;
    --info-soft: #eaf1fb;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c;
      --card: #1b2129;
      --text: #e6e9ee;
      --muted: #9aa5b4;
      --border: #2d3541;
      --accent: #ef5350;
      --accent-soft: #3a1f21;
      --ok: #66bb6a;
      --ok-soft: #1e3220;
      --bad: #ef5350;
      --bad-soft: #3a1f21;
      --warn: #ffb74d;
      --warn-soft: #3a2e1a;
      --info-soft: #1c2838;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c;
    --card: #1b2129;
    --text: #e6e9ee;
    --muted: #9aa5b4;
    --border: #2d3541;
    --accent: #ef5350;
    --accent-soft: #3a1f21;
    --ok: #66bb6a;
    --ok-soft: #1e3220;
    --bad: #ef5350;
    --bad-soft: #3a1f21;
    --warn: #ffb74d;
    --warn-soft: #3a2e1a;
    --info-soft: #1c2838;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .bar {
    max-width: 820px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .logo { font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .logo .cross {
    width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 800;
  }
  .score { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .score b { color: var(--text); }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  h3 { font-size: 16px; margin: 16px 0 8px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .case-tile {
    text-align: left; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer;
    font: inherit; transition: border-color .15s, transform .15s;
  }
  .case-tile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .case-tile .emoji { font-size: 26px; }
  .case-tile .title { font-weight: 600; margin-top: 6px; }
  .case-tile .done { font-size: 13px; color: var(--ok); margin-top: 4px; }
  .steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .step {
    font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  }
  .step.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step.done { color: var(--ok); border-color: var(--ok); }
  .vitals { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
  .vital { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .vital .k { font-size: 12px; color: var(--muted); }
  .vital .v { font-weight: 600; }
  .vital.alert .v { color: var(--bad); }
  ul.symptoms { margin: 6px 0 0; padding-left: 20px; }
  ul.symptoms li { margin-bottom: 3px; }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; text-align: left;
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; font: inherit; width: 100%;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .box {
    flex: 0 0 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  }
  .opt.radio .box { border-radius: 50%; }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .opt.selected .box { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .box { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .box { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt.missed { border-color: var(--warn); border-style: dashed; background: var(--warn-soft); }
  .opt .why { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .opt .why b { color: var(--text); }
  .feedback { border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .feedback.ok { background: var(--ok-soft); border: 1px solid var(--ok); }
  .feedback.bad { background: var(--bad-soft); border: 1px solid var(--bad); }
  .feedback.mid { background: var(--warn-soft); border: 1px solid var(--warn); }
  .btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .legend { font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .legend .l-ok::before { background: var(--ok); }
  .legend .l-bad::before { background: var(--bad); }
  .legend .l-miss::before { border: 2px dashed var(--warn); width: 7px; height: 7px; }

  /* Merkkarte */
  .memo { border: 2px solid var(--accent); }
  .memo-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .memo-section { margin-top: 14px; }
  .memo-section h3 { margin: 0 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
  .memo ul { margin: 0; padding-left: 20px; }
  .memo li { margin-bottom: 4px; }
  table.drugs { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.drugs th, table.drugs td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.drugs th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .table-wrap { overflow-x: auto; }
  .pearl { background: var(--info-soft); border-radius: 8px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
  .disclaimer { font-size: 13px; color: var(--muted); margin-top: 20px; }
  .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  @media print {
    header, .btns, .steps, .no-print { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" onclick="showMenu()"><span class="cross">+</span> Notfall-Fallquiz</div>
    <div class="score">Punkte: <b id="score">0</b> / <b id="maxScore">0</b></div>
  </div>
</header>
<main id="app"></main>

<script>
/*

    vitals: [

    ],
    therapy: [
      { t: "Acetylsalicylsäure (ASS) 150–300 mg p.o. (oder 75–250 mg i.v.)", ok: true, why: "Thrombozytenaggregationshemmung so früh wie möglich, sofern keine Kontraindikation besteht." },

    ],
    therapy: [

const STEPS = ["Fall", "Diagnose", "Therapie", "Merkkarte"];
const state = { score: 0, max: 0, done: {}, results: {}, queue: null };

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const app = document.getElementById("app");
function updateScore() {
  document.getElementById("score").textContent = state.score;
  document.getElementById("maxScore").textContent = state.max;
}
function stepsBar(active) {
  return `<div class="steps">${STEPS.map((s, i) =>
    `<span class="step ${i === active ? "active" : i < active ? "done" : ""}">${i < active ? "✓ " : ""}${s}</span>`
  ).join("")}</div>`;
}
function caseHeader(c) {
  return `<span class="tag">${c.setting}</span><h2>${c.emoji} ${c.title}</h2>`;
}

function showMenu() {
  state.queue = null;
  window.scrollTo(0, 0);
  app.innerHTML = `
    <div class="card">
      <h1>Notfallmedizin-Fallquiz</h1>
      <p class="muted">Lies Anamnese und Leitsymptome, stelle die Verdachtsdiagnose und wähle die passende Therapie inklusive Dosierung. Zum Abschluss jedes Falls bekommst du eine Merkkarte mit den Leitlinien.</p>
      <div class="btns"><button class="primary" onclick="startAll()">▶ Alle Fälle nacheinander spielen</button>
        <button class="secondary" onclick="showAllMemos()">📋 Alle Merkkarten</button></div>
    </div>
    <div class="grid">
      ${CASES.map(c => `
        <button class="case-tile" onclick="startCase('${c.id}')">
          <div class="emoji">${c.emoji}</div>
          <div class="title">${c.title}</div>
          <div class="muted" style="font-size:14px">${c.setting}</div>
          ${state.done[c.id] ? `<div class="done">✓ gelöst – ${state.results[c.id].pts}/${state.results[c.id].max} Punkte</div>` : ""}
        </button>`).join("")}
    </div>
    <p class="disclaimer">⚠️ Nur für Lern- und Übungszwecke. Dosierungen beziehen sich – wenn nicht anders angegeben – auf Erwachsene und orientieren sich an ERC-, ESC- und AWMF-Leitlinien. Im Einsatz gelten die lokalen SOPs, die Fachinformationen und die ärztliche Anordnung.</p>`;
}

function startAll() {
  state.queue = shuffle(CASES.map(c => c.id));
  nextInQueue();
}
function nextInQueue() {
  if (state.queue && state.queue.length) startCase(state.queue.shift(), true);
  else showSummary();
}
function startCase(id, fromQueue) {
  if (!fromQueue) state.queue = null;
  const c = CASES.find(x => x.id === id);
  window.scrollTo(0, 0);
  app.innerHTML = `
    <div class="card">
      ${stepsBar(0)}
      ${caseHeader(c)}
      <h3>Anamnese</h3>
      <p>${c.anamnese}</p>
      <h3>Befunde & Vitalparameter</h3>
      <div class="vitals">
        ${c.vitals.map(([k, v, alert]) => `<div class="vital ${alert ? "alert" : ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
      </div>
      <h3>Leitsymptome</h3>
      <ul class="symptoms">${c.symptoms.map(s => `<li>${s}</li>`).join("")}</ul>
      <div class="btns">
        <button class="primary" onclick="showDiagnosis('${c.id}')">Weiter zur Verdachtsdiagnose →</button>
        <button class="secondary" onclick="showMenu()">Zurück zur Übersicht</button>
      </div>
    </div>`;
}

function caseSummaryCard(c) {
  return `<div class="card no-print" style="padding:14px 20px">
    <details><summary style="cursor:pointer;font-weight:600">${c.emoji} Fall nochmal ansehen</summary>
      <p style="margin-top:10px">${c.anamnese}</p>
      <div class="vitals">${c.vitals.map(([k, v, a]) => `<div class="vital ${a ? "alert" : ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    </details></div>`;
}

function showDiagnosis(id) {
  const c = CASES.find(x => x.id === id);
  const opts = shuffle(c.diagnoses);
  state.current = { id, diagOpts: opts, diagPts: 0 };
  window.scrollTo(0, 0);
  app.innerHTML = `
    ${caseSummaryCard(c)}
    <div class="card">
      ${stepsBar(1)}
      ${caseHeader(c)}
      <p><b>Wie lautet deine Verdachtsdiagnose?</b></p>
      <div class="options" id="diagOpts">
        ${opts.map((o, i) => `<button class="opt radio" data-i="${i}" onclick="pickDiag(${i})"><span class="box"></span><span>${o.t}</span></button>`).join("")}
      </div>
      <div id="diagFeedback"></div>
    </div>`;
}

function pickDiag(i) {
  const cur = state.current;
  const c = CASES.find(x => x.id === cur.id);
  const buttons = document.querySelectorAll("#diagOpts .opt");
  const chosen = cur.diagOpts[i];
  buttons.forEach((b, j) => {
    b.disabled = true;
    const o = cur.diagOpts[j];
    if (o.ok) { b.classList.add("correct"); b.querySelector(".box").textContent = "✓"; }
    else if (j === i) { b.classList.add("wrong"); b.querySelector(".box").textContent = "✗"; }
    if (!o.ok && o.why) {
      b.querySelector("span:last-child").insertAdjacentHTML("beforeend", `<span class="why">${o.why}</span>`);
    }
  });
  cur.diagPts = chosen.ok ? 2 : 0;
  const right = cur.diagOpts.find(o => o.ok).t;
  document.getElementById("diagFeedback").innerHTML = `
    <div class="feedback ${chosen.ok ? "ok" : "bad"}">
      ${chosen.ok ? `<b>Richtig! +2 Punkte.</b> ${right}.` : `<b>Leider falsch.</b> Die Verdachtsdiagnose lautet: <b>${right}</b>.`}
    </div>
    <div class="btns"><button class="primary" onclick="showTherapy('${c.id}')">Weiter zur Therapie →</button></div>`;
}

function showTherapy(id) {
  const c = CASES.find(x => x.id === id);
  const opts = shuffle(c.therapy);
  state.current.therOpts = opts;
  state.current.sel = new Set();
  const right = c.diagnoses.find(d => d.ok).t;
  window.scrollTo(0, 0);
  app.innerHTML = `
    ${caseSummaryCard(c)}
    <div class="card">
      ${stepsBar(2)}
      ${caseHeader(c)}
      <p class="muted">Diagnose: <b style="color:var(--text)">${right}</b></p>
      <p><b>Welche Maßnahmen und Medikamente wählst du?</b> Mehrfachauswahl – achte auf Dosierungen, Applikationswege und Kontraindikationen!</p>
      <div class="options" id="therOpts">
        ${opts.map((o, i) => `<button class="opt" data-i="${i}" onclick="toggleTher(${i})"><span class="box"></span><span>${o.t}</span></button>`).join("")}
      </div>
      <div id="therFeedback">
        <div class="btns"><button class="primary" id="checkBtn" disabled onclick="checkTher()">Therapie überprüfen</button></div>
      </div>
    </div>`;
}

function toggleTher(i) {
  const sel = state.current.sel;
  const btn = document.querySelector(`#therOpts .opt[data-i="${i}"]`);
  if (sel.has(i)) { sel.delete(i); btn.classList.remove("selected"); btn.querySelector(".box").textContent = ""; }
  else { sel.add(i); btn.classList.add("selected"); btn.querySelector(".box").textContent = "✓"; }
  document.getElementById("checkBtn").disabled = sel.size === 0;
}

function checkTher() {
  const cur = state.current;
  const c = CASES.find(x => x.id === cur.id);
  let hits = 0, wrong = 0, missed = 0;
  const totalOk = cur.therOpts.filter(o => o.ok).length;
  document.querySelectorAll("#therOpts .opt").forEach((b, j) => {
    const o = cur.therOpts[j];
    const picked = cur.sel.has(j);
    b.disabled = true;
    b.classList.remove("selected");
    const box = b.querySelector(".box");
    if (o.ok && picked) { hits++; b.classList.add("correct"); box.textContent = "✓"; }
    else if (o.ok && !picked) { missed++; b.classList.add("missed"); box.textContent = "!"; }
    else if (!o.ok && picked) { wrong++; b.classList.add("wrong"); box.textContent = "✗"; }
    else { box.textContent = ""; }
    if (o.why && (o.ok || picked)) {
      b.querySelector("span:last-child").insertAdjacentHTML("beforeend", `<span class="why">${o.why}</span>`);
    } else if (o.why) {
      b.querySelector("span:last-child").insertAdjacentHTML("beforeend", `<span class="why">✓ Richtig weggelassen. ${o.why}</span>`);
    }
  });
  const therPts = Math.max(0, hits - wrong);
  const pts = cur.diagPts + therPts;
  const max = 2 + totalOk;
  if (!state.done[c.id]) { state.score += pts; state.max += max; }
  else {
    state.score += pts - state.results[c.id].pts;
  }
  state.done[c.id] = true;
  state.results[c.id] = { pts, max };
  updateScore();
  const cls = wrong === 0 && missed === 0 ? "ok" : wrong > 0 ? "bad" : "mid";
  const msg = wrong === 0 && missed === 0
    ? "<b>Perfekt!</b> Alle richtigen Maßnahmen gewählt und keine Fehler."
    : `${hits} von ${totalOk} richtigen Maßnahmen gewählt${missed ? `, ${missed} vergessen` : ""}${wrong ? `, <b>${wrong} falsch/gefährlich</b> (je −1 Punkt)` : ""}.`;
  document.getElementById("therFeedback").innerHTML = `
    <div class="legend"><span class="l-ok">richtig gewählt</span><span class="l-bad">falsch gewählt</span><span class="l-miss">vergessen</span></div>
    <div class="feedback ${cls}">${msg}<br>Punkte in diesem Fall: <b>${pts} / ${max}</b></div>
    <div class="btns"><button class="primary" onclick="showMemo('${c.id}')">Zur Merkkarte →</button></div>`;
}

function memoCard(c) {
  const m = c.memo;
  return `
    <div class="card memo">
      <div class="memo-head">
        <h2>📋 Merkkarte: ${m.title}</h2>
        <span class="muted" style="font-size:13px">${m.source}</span>
      </div>
      <div class="memo-section">
        <h3>Leitsymptome</h3>
        <ul>${c.symptoms.map(s => `<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="memo-section">
        <h3>Vorgehen nach Leitlinie</h3>
        <ul>${m.key.map(s => `<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="memo-section">
        <h3>Medikamente & Dosierungen</h3>
        <div class="table-wrap">
          <table class="drugs">
            <thead><tr><th>Medikament</th><th>Dosierung</th><th>Cave / KI</th></tr></thead>
            <tbody>${m.drugs.map(([a, b, d]) => `<tr><td><b>${a}</b></td><td>${b}</td><td>${d}</td></tr>`).join("")}</tbody>
          </table>
        </div>
      </div>
      <div class="memo-section">
        <h3>Typische Fehler</h3>
        <ul>${c.therapy.filter(o => !o.ok).map(o => `<li>${o.t} – ${o.why.replace(/<b>.*?<\/b>\s*/, "")}</li>`).join("")}</ul>
      </div>
      <div class="pearl">💡 ${m.pearl}</div>
    </div>`;
}

function showMemo(id) {
  const c = CASES.find(x => x.id === id);
  const queued = state.queue !== null;
  window.scrollTo(0, 0);
  app.innerHTML = `
    ${stepsBar(3)}
    ${memoCard(c)}
    <div class="btns">
      ${queued
        ? `<button class="primary" onclick="nextInQueue()">${state.queue.length ? `Nächster Fall (${state.queue.length} übrig) →` : "Zur Auswertung →"}</button>`
        : `<button class="primary" onclick="showMenu()">Zur Fallübersicht</button>`}
      <button class="secondary" onclick="startCase('${c.id}', ${queued})">Fall wiederholen</button>
      <button class="secondary" onclick="window.print()">🖨 Merkkarte drucken</button>
    </div>
    <p class="disclaimer">⚠️ Lernhilfe – ersetzt keine Leitlinie, SOP oder Fachinformation.</p>`;
}

function showSummary() {
  state.queue = null;
  const pct = state.max ? Math.round(state.score / state.max * 100) : 0;
  const verdict = pct >= 90 ? "Hervorragend – du bist einsatzbereit! 🚑"
    : pct >= 70 ? "Gut gemacht! Ein paar Details solltest du noch wiederholen."
    : "Da geht noch was – schau dir die Merkkarten nochmal in Ruhe an.";
  window.scrollTo(0, 0);
  app.innerHTML = `
    <div class="card">
      <h1>Auswertung</h1>
      <p style="font-size:20px"><b>${state.score} / ${state.max} Punkte (${pct} %)</b></p>
      <p>${verdict}</p>
      ${CASES.filter(c => state.results[c.id]).map(c =>
        `<div class="result-row"><span>${c.emoji} ${c.memo.title}</span><b>${state.results[c.id].pts} / ${state.results[c.id].max}</b></div>`).join("")}
      <div class="btns">
        <button class="primary" onclick="showAllMemos()">📋 Alle Merkkarten anzeigen</button>
        <button class="secondary" onclick="resetAll()">Neu starten</button>
        <button class="secondary" onclick="showMenu()">Fallübersicht</button>
      </div>
    </div>`;
}

function showAllMemos() {
  window.scrollTo(0, 0);
  app.innerHTML = `
    <div class="btns no-print" style="margin-top:0;margin-bottom:16px">
      <button class="primary" onclick="window.print()">🖨 Alle drucken</button>
      <button class="secondary" onclick="showMenu()">Zur Fallübersicht</button>
    </div>
    ${CASES.map(memoCard).join("")}
    <p class="disclaimer">⚠️ Lernhilfe – ersetzt keine Leitlinie, SOP oder Fachinformation.</p>`;
}

function resetAll() {
  state.score = 0; state.max = 0; state.done = {}; state.results = {};
  updateScore();
  showMenu();
}

updateScore();
showMenu();
</script>
</body>
</html>
